name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} (windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - name: Self-scan (no secret-shaped value may live in the repo)
        run: python -m courier scan . --fail-on-findings
      - name: Doctor through the wrapper
        run: .\scripts\courier.cmd doctor

  powershell:
    name: PowerShell ops (Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'powershell/tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
