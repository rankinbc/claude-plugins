name: marketplace

on:
  push:
    branches: [main]
    tags: ['*--v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Marketplace and plugin manifests are consistent
        run: python scripts/check_marketplace.py
      - name: Release tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_marketplace.py --tag "${GITHUB_REF_NAME}"
