name: recursive-research

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/recursive-research/**'
      - '.github/workflows/recursive-research.yml'
  pull_request:
    paths:
      - 'plugins/recursive-research/**'
      - '.github/workflows/recursive-research.yml'

defaults:
  run:
    working-directory: plugins/recursive-research

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The plugin uses the standard library only, so there is nothing to install.
      - run: python -m unittest discover -s tests
